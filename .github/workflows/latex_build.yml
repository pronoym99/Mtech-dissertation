name: Build LaTeX document
on:
  push:
    branches: [master]
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '**/*.cls'
      - '**/*.sty'
      - 'Report/images/**'
      - 'Report/auxiliary_pages.pdf'
  workflow_dispatch:
jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
             && [ -n "${{ github.event.before }}" ] \
             && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          # Fall back to the empty tree if BASE doesn't exist (e.g. first commit).
          if ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          # Files that affect the compiled PDF (includes images + the input PDF).
          BUILD_FILES="$(git diff --name-only --diff-filter=ACM "$BASE" HEAD -- \
                          '*.tex' '*.bib' '*.cls' '*.sty' \
                          'Report/images' 'Report/auxiliary_pages.pdf' | tr '\n' ' ')"
          # Source files that changed (used only to decide whether to run tex-fmt).
          FMT_FILES="$(git diff --name-only --diff-filter=ACM "$BASE" HEAD -- \
                        '*.tex' '*.bib' '*.cls' '*.sty' | tr '\n' ' ')"

          echo "build_files=$BUILD_FILES" >> "$GITHUB_OUTPUT"
          echo "fmt_files=$FMT_FILES" >> "$GITHUB_OUTPUT"
          echo "Build-affecting changes: ${BUILD_FILES:-<none>}"
          echo "Formattable changes:     ${FMT_FILES:-<none>}"

      - name: Compile LaTeX document
        if: steps.changed.outputs.build_files != ''
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: Report
          root_file: main.tex

      - name: Upload PDF file
        if: steps.changed.outputs.build_files != ''
        uses: actions/upload-artifact@v7
        with:
          name: PDF
          path: Report/main.pdf
          if-no-files-found: error

      - name: Format LaTeX with tex-fmt
        if: steps.changed.outputs.fmt_files != ''
        uses: grayespinoza/tex-fmt-action@v1.0.0
        with:
          inputs: Report

      - name: Commit formatting changes
        if: steps.changed.outputs.fmt_files != ''
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: "style: format LaTeX with tex-fmt [skip ci]"
          file_pattern: '*.tex *.bib *.cls *.sty'

      - name: Compute release version
        id: version
        if: steps.changed.outputs.build_files != ''
        run: |
          echo "version=v$(date -u +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish PDF as a release
        if: steps.changed.outputs.build_files != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Automated build of the LaTeX document.

            - Commit: ${{ github.sha }}
            - Built: ${{ steps.version.outputs.version }}
          files: Report/main.pdf
          make_latest: true
